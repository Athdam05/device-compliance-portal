# Target node(s) for the Device Compliance Management Portal.
# In this lab the node is a container on the Docker network "dcmp-net"; on a real server only ansible_host changes.
[dcmp_servers]
dcmp-node ansible_host=dcmp-node

[dcmp_servers:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
ansible_become=true
