---
# Steps 13-14 - configure / provision a server for the Device Compliance Management Portal.
# * Idempotent: running it again on a configured node reports changed=0.
# * Safe releases: each version lives in /opt/dcmp/releases/<version>; /opt/dcmp/current points at the active one.
#   If the new release fails its health check the play restores the previous release automatically and then fails.
- name: Provision Device Compliance Portal server
  hosts: dcmp_servers
  become: true

  tasks:
    # ---------------- packages ----------------
    - name: Refresh apt cache (best effort - a refresh is not a configuration change and needs no internet once packages are installed)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false
      failed_when: false

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: "{{ os_packages }}"
        state: present

    # ---------------- user, folders ----------------
    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Create unprivileged application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        home: "{{ app_home }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create application, release, data and log folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_home }}", mode: "0755" }
        - { path: "{{ app_home }}/releases", mode: "0755" }
        - { path: "{{ app_home }}/releases/{{ app_version }}", mode: "0755" }
        - { path: "{{ data_dir | dirname }}", mode: "0755" }
        - { path: "{{ data_dir }}", mode: "0750" }
        - { path: "{{ log_dir }}", mode: "0755" }

    # ---------------- remember what is running now (for rollback) ----------------
    - name: Look at the currently active release
      ansible.builtin.stat:
        path: "{{ app_home }}/current"
      register: current_link

    - name: Remember the previous release
      ansible.builtin.set_fact:
        previous_release: "{{ current_link.stat.lnk_target | default('') if current_link.stat.islnk | default(false) else '' }}"

    - name: Show release change
      ansible.builtin.debug:
        msg: "active release: '{{ previous_release | basename }}'  ->  new release: '{{ app_version }}'"

    # ---------------- deploy the new release, with automatic rollback ----------------
    - name: Deploy and verify release {{ app_version }}
      block:
        - name: Deploy the application WAR into its versioned release folder
          ansible.builtin.copy:
            src: "{{ war_src }}"
            dest: "{{ app_home }}/releases/{{ app_version }}/app.war"
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0640"
          notify: Apply service changes

        - name: Point 'current' at this release
          ansible.builtin.file:
            src: "{{ app_home }}/releases/{{ app_version }}"
            dest: "{{ app_home }}/current"
            state: link
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
          notify: Apply service changes

        - name: Install the supervisor program definition for the application
          ansible.builtin.template:
            src: dcmp.conf.j2
            dest: "/etc/supervisor/conf.d/{{ app_name }}.conf"
            owner: root
            group: root
            mode: "0644"
          notify: Apply service changes

        - name: Apply pending service changes now (so the health check below tests the new release)
          ansible.builtin.meta: flush_handlers

        - name: Make sure the application service is running
          ansible.builtin.command: supervisorctl status {{ app_name }}
          register: svc_status
          changed_when: false
          failed_when: "'RUNNING' not in svc_status.stdout and 'STARTING' not in svc_status.stdout"

        - name: Wait until the application port is listening
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ app_port }}"
            timeout: "{{ health_wait }}"

        - name: Health check
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ app_port }}/actuator/health"
            return_content: true
          register: health
          retries: 6
          delay: 5
          until: health.status == 200 and "UP" in health.content

        - name: Report result
          ansible.builtin.debug:
            msg: "{{ app_name }} {{ app_version }} (env={{ app_env }}) is {{ health.json.status }} on port {{ app_port }}"

      rescue:
        - name: "ROLLBACK - release {{ app_version }} failed its health check"
          ansible.builtin.debug:
            msg: "restoring previous release '{{ previous_release | basename }}'"

        - name: Stop here if there is nothing to roll back to
          ansible.builtin.fail:
            msg: "Release {{ app_version }} failed and there is no previous release to restore."
          when: previous_release == ''

        - name: Re-point 'current' at the previous release
          ansible.builtin.file:
            src: "{{ previous_release }}"
            dest: "{{ app_home }}/current"
            state: link
            owner: "{{ app_user }}"
            group: "{{ app_group }}"

        - name: Remove the failed release folder
          ansible.builtin.file:
            path: "{{ app_home }}/releases/{{ app_version }}"
            state: absent

        - name: Restore the service definition (so APP_VERSION names the release that is really running)
          ansible.builtin.template:
            src: dcmp.conf.j2
            dest: "/etc/supervisor/conf.d/{{ app_name }}.conf"
            owner: root
            group: root
            mode: "0644"
          vars:
            release_label: "{{ previous_release | basename }}"

        - name: Restart the service on the previous release
          ansible.builtin.shell: |
            supervisorctl reread
            supervisorctl update {{ app_name }}
            supervisorctl restart {{ app_name }}
          changed_when: true

        - name: Health check after rollback
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ app_port }}/actuator/health"
            return_content: true
          register: recovered
          retries: 12
          delay: 5
          until: recovered.status == 200 and "UP" in recovered.content

        - name: Fail the play so the bad release is reported
          ansible.builtin.fail:
            msg: "Release {{ app_version }} FAILED health check - rolled back to {{ previous_release | basename }} ({{ recovered.json.status }})."

  handlers:
    - name: Apply service changes
      ansible.builtin.shell: |
        supervisorctl reread
        supervisorctl update {{ app_name }}
        supervisorctl restart {{ app_name }}
      changed_when: true
