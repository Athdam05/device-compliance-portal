<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
  <h1>Login</h1>
  <p id="login-error" th:if="${error}" th:text="${error}"></p>
  <form th:action="@{/login}" method="post">
    <p>Username: <input id="username" type="text" name="username"/></p>
    <p>Password: <input id="password" type="password" name="password"/></p>
    <p><button id="login" type="submit">Login</button></p>
  </form>
</body>
</html>
