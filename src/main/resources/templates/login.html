<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
  <div class="card auth">
    <h1>Sign in</h1>
    <p class="subtle">Use one of the demo accounts to continue.</p>
    <p id="login-error" class="alert" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/login}" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autofocus/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password"/>
      </div>
      <button id="login" class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="demo-hint">Demo roles: <code>admin</code> (everything), <code>tech</code> (technician), <code>auditor</code> (auditor).</p>
  </div>
</main>
</body>
</html>
