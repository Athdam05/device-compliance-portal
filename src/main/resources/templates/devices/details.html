<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Device Details</title></head>
<body>
  <h1 id="device-name" th:text="${device.name}">Name</h1>
  <ul>
    <li>Owner: <span th:text="${device.owner}"></span></li>
    <li>Serial No: <span th:text="${device.serialNo}"></span></li>
    <li>OS: <span th:text="${device.os}"></span></li>
    <li>Antivirus: <span th:text="${device.antivirusEnabled}"></span></li>
    <li>Disk encrypted: <span th:text="${device.diskEncrypted}"></span></li>
    <li>Firewall: <span th:text="${device.firewallEnabled}"></span></li>
    <li>Compliance: <span id="compliance" th:text="${device.compliant} ? 'COMPLIANT' : 'NON_COMPLIANT'"></span></li>
    <li>Status: <span id="status" th:text="${device.workflowStatus}"></span></li>
  </ul>

  <h2>Move status</h2>
  <form th:each="next : ${@workflowService.nextStatuses(session.user.role, device.workflowStatus)}"
        th:action="@{/devices/{id}/status(id=${device.id})}" method="post" style="display:inline">
    <input type="hidden" name="to" th:value="${next}"/>
    <button type="submit" th:id="'to-' + ${next}" th:text="'Move to ' + ${next}"></button>
  </form>
  <p th:if="${#lists.isEmpty(@workflowService.nextStatuses(session.user.role, device.workflowStatus))}">
    No transitions available for your role.</p>

  <h2>Status history</h2>
  <table border="1" cellpadding="4">
    <thead><tr><th>When</th><th>From</th><th>To</th><th>By</th></tr></thead>
    <tbody>
      <tr th:each="h : ${@statusHistoryRepository.findByDeviceIdOrderByChangedAtDesc(device.id)}">
        <td th:text="${#temporals.format(h.changedAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${h.fromStatus}"></td>
        <td th:text="${h.toStatus}"></td>
        <td th:text="${h.changedBy}"></td>
      </tr>
    </tbody>
  </table>
  <p><a th:href="@{/devices}">Back to list</a></p>
</body>
</html>
