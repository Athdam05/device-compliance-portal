<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Device Form</title></head>
<body>
  <h1 th:text="${device.id == null} ? 'Register Device' : 'Edit Device'">Register Device</h1>
  <form th:action="${device.id == null} ? @{/devices} : @{/devices/{id}(id=${device.id})}"
        th:object="${device}" method="post">
    <p>Name: <input id="name" type="text" th:field="*{name}"/>
       <span id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></p>
    <p>Owner: <input id="owner" type="text" th:field="*{owner}"/>
       <span th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}"></span></p>
    <p>Serial No: <input id="serialNo" type="text" th:field="*{serialNo}"/>
       <span th:if="${#fields.hasErrors('serialNo')}" th:errors="*{serialNo}"></span></p>
    <p>OS: <input id="os" type="text" th:field="*{os}"/>
       <span th:if="${#fields.hasErrors('os')}" th:errors="*{os}"></span></p>
    <p><label><input type="checkbox" th:field="*{antivirusEnabled}"/> Antivirus enabled</label></p>
    <p><label><input type="checkbox" th:field="*{diskEncrypted}"/> Disk encrypted</label></p>
    <p><label><input type="checkbox" th:field="*{firewallEnabled}"/> Firewall enabled</label></p>
    <p><button id="save" type="submit">Save</button> <a href="/devices">Cancel</a></p>
  </form>
</body>
</html>
