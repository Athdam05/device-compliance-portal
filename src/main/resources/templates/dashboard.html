<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
  <div class="page-head">
    <div>
      <h1>Compliance Dashboard</h1>
      <p class="subtle">Summary of all registered devices</p>
    </div>
    <a class="btn" th:href="@{/devices}">View devices</a>
  </div>

  <div class="stats">
    <div class="stat"><span class="num" id="total" th:text="${total}">0</span><span class="lbl">Total devices</span></div>
    <div class="stat ok"><span class="num" id="compliant" th:text="${compliant}">0</span><span class="lbl">Compliant</span></div>
    <div class="stat bad"><span class="num" id="non-compliant" th:text="${nonCompliant}">0</span><span class="lbl">Non-compliant</span></div>
  </div>

  <div class="card">
    <h2>By workflow status</h2>
    <div class="stats4">
      <div class="mini"><span class="num" th:text="${reported}">0</span><span class="lbl">Reported</span></div>
      <div class="mini"><span class="num" th:text="${underReview}">0</span><span class="lbl">Under review</span></div>
      <div class="mini"><span class="num" th:text="${remediated}">0</span><span class="lbl">Remediated</span></div>
      <div class="mini"><span class="num" th:text="${closed}">0</span><span class="lbl">Closed</span></div>
    </div>
  </div>
</main>
</body>
</html>
