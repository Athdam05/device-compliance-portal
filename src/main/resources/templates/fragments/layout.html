<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - Device Compliance Portal'">Device Compliance Portal</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="nav">
  <div class="topbar-inner">
    <a class="brand" th:href="@{/}"><span class="brand-mark">DC</span> Device Compliance Portal</a>
    <nav>
      <a th:href="@{/devices}">Devices</a>
      <a th:href="@{/dashboard}">Dashboard</a>
    </nav>
    <div class="userbox" th:if="${session.user != null}">
      <span id="who" th:text="${session.user.username} + ' (' + ${session.user.role} + ')'"></span>
      <form th:action="@{/logout}" method="post"><button id="logout" class="btn btn-ghost" type="submit">Logout</button></form>
    </div>
  </div>
</header>
</body>
</html>
